AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudGuard Bank: Event-Driven FinTech Transaction, Compliance & Resilience Platform.
  Production-grade IaC provisioning VPC, Subnets, ALB, ASG, S3, SQS + DLQ, RDS PostgreSQL,
  DynamoDB, KMS Customer Managed Key, SNS, CloudWatch Alarms, and AWS Budgets.
  Designed for DS3203A: Cloud Computing viva and production deployment.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues: [production, staging, dev]
    Description: Deployment target tier.

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for CloudGuard Virtual Private Cloud.

  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR for Public Subnet 1 (AZ-A, ALB & NAT Gateway).

  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR for Public Subnet 2 (AZ-B, ALB Multi-AZ).

  PrivateAppSubnet1CIDR:
    Type: String
    Default: 10.0.10.0/24
    Description: CIDR for Private App Subnet 1 (AZ-A, EC2 ASG Nodes).

  PrivateAppSubnet2CIDR:
    Type: String
    Default: 10.0.11.0/24
    Description: CIDR for Private App Subnet 2 (AZ-B, EC2 ASG Nodes).

  PrivateDataSubnet1CIDR:
    Type: String
    Default: 10.0.20.0/24
    Description: CIDR for Private Data Subnet 1 (AZ-A, RDS PostgreSQL).

  PrivateDataSubnet2CIDR:
    Type: String
    Default: 10.0.21.0/24
    Description: CIDR for Private Data Subnet 2 (AZ-B, RDS Multi-AZ standby).

  DBUsername:
    Type: String
    Default: cloudguard_admin
    NoEcho: true
    Description: Master username for RDS PostgreSQL Ledger DB.

  DBPassword:
    Type: String
    Default: C1oudGuardP@ss2026!
    NoEcho: true
    Description: Master password for RDS PostgreSQL Ledger DB (PCI-DSS compliant).

  AlertNotificationEmail:
    Type: String
    Default: cloudguard-alerts@university.edu
    Description: Destination email for FinOps budget breaches and fraud alerts.

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: Automatically resolved latest Amazon Linux 2023 AMI.

Resources:
  # =========================================================================
  # UNIT 2: NETWORKING & VIRTUAL PRIVATE CLOUD (VPC)
  # =========================================================================
  CloudGuardVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-VPC'
        - Key: Course
          Value: DS3203A-Cloud-Computing
        - Key: Project
          Value: CloudGuard-Bank

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-IGW'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref CloudGuardVPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets (ALB & NAT Gateway)
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudGuardVPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Public-1'
        - Key: Tier
          Value: Public-Ingress

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudGuardVPC
      CidrBlock: !Ref PublicSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Public-2'
        - Key: Tier
          Value: Public-Ingress

  # Private Subnets (EC2 Compute Tier)
  PrivateAppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudGuardVPC
      CidrBlock: !Ref PrivateAppSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Private-App-1'
        - Key: Tier
          Value: Private-Compute

  PrivateAppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudGuardVPC
      CidrBlock: !Ref PrivateAppSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Private-App-2'
        - Key: Tier
          Value: Private-Compute

  # Private Subnets (RDS Data Tier)
  PrivateDataSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudGuardVPC
      CidrBlock: !Ref PrivateDataSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Private-Data-1'
        - Key: Tier
          Value: Private-Database

  PrivateDataSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudGuardVPC
      CidrBlock: !Ref PrivateDataSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Private-Data-2'
        - Key: Tier
          Value: Private-Database

  # Elastic IP and NAT Gateway for Outbound Egress from Private Subnets
  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-NAT-EIP'

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-NAT-GW'

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CloudGuardVPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Public-RouteTable'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CloudGuardVPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Private-RouteTable'

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateAppSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateAppSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnet2
      RouteTableId: !Ref PrivateRouteTable

  PrivateDataSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDataSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateDataSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDataSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # =========================================================================
  # SECURITY GROUPS: DEFENSE-IN-DEPTH TIER ISOLATION
  # =========================================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP/HTTPS ingress for Application Load Balancer
      VpcId: !Ref CloudGuardVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ALB-SG'

  EC2AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ingestion Node security group accepting traffic solely from ALB
      VpcId: !Ref CloudGuardVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Allow HTTP traffic from ALB to Express Ingestion API
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-EC2-SG'

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL Database isolation restricted to App Tier and Lambda
      VpcId: !Ref CloudGuardVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2AppSecurityGroup
          Description: Allow PostgreSQL queries from EC2 App Tier
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Allow ACID ledger settlement from Lambda Fraud Worker
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-RDS-SG'

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress-only Security Group for Lambda Worker running inside VPC
      VpcId: !Ref CloudGuardVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Lambda-SG'

  # =========================================================================
  # UNIT 4: SECURITY & COMPLIANCE (AWS KMS ENCRYPTION)
  # =========================================================================
  CloudGuardKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer Managed Key (CMK) for CloudGuard FinTech PII & Data Encryption at Rest
      Enabled: true
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: '2012-10-17'
        Id: cloudguard-kms-least-privilege
        Statement:
          - Sid: EnableRootManagement
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-KMS-Key'
        - Key: Compliance
          Value: PCI-DSS-v4.0

  CloudGuardKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/cloudguard-fintech-key
      TargetKeyId: !Ref CloudGuardKMSKey

  # =========================================================================
  # UNIT 3 & 4: S3 SECURE STORAGE & CROSS-REGION REPLICATION SOURCE
  # =========================================================================
  CloudGuardReceiptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'cloudguard-receipts-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt CloudGuardKMSKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToGlacierInstantRetrieval
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER_IR
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Receipts'

  # =========================================================================
  # UNIT 3: ASYNCHRONOUS MESSAGING & EVENT DECOUPLING (SQS + DLQ)
  # =========================================================================
  TransactionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-TransactionDLQ'
      MessageRetentionPeriod: 1209600 # 14 Days max retention
      KmsMasterKeyId: !GetAtt CloudGuardKMSKey.Arn
      Tags:
        - Key: Purpose
          Value: Dead-Letter-Queue-Poison-Pill-Quarantine

  TransactionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-TransactionQueue'
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600 # 4 Days retention
      KmsMasterKeyId: !GetAtt CloudGuardKMSKey.Arn
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TransactionDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Purpose
          Value: High-Throughput-Transaction-Buffer

  # =========================================================================
  # UNIT 3 & 4: NOTIFICATIONS (AMAZON SNS FRAUD ALERT TOPIC)
  # =========================================================================
  FraudAlertSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-FraudAlerts'
      DisplayName: CloudGuard Security Operations Alert Bus
      KmsMasterKeyId: !GetAtt CloudGuardKMSKey.Arn
      Subscription:
        - Endpoint: !Ref AlertNotificationEmail
          Protocol: email
      Tags:
        - Key: AlertType
          Value: CriticalSecOps

  # =========================================================================
  # UNIT 5: POLYGLOT PERSISTENCE (RDS POSTGRESQL + DYNAMODB AUDIT)
  # =========================================================================
  # Amazon DynamoDB (Eventual Consistency, High Throughput, Auditing)
  CloudGuardAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-AuditTable'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transactionId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: transactionId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt CloudGuardKMSKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-DynamoDB'
        - Key: Model
          Value: NoSQL-Eventual-Consistency

  # Amazon RDS PostgreSQL (ACID Ledger, Strong Consistency, Multi-AZ Ready)
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for CloudGuard isolated RDS cluster
      SubnetIds:
        - !Ref PrivateDataSubnet1
        - !Ref PrivateDataSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-RDS-SubnetGroup'

  CloudGuardLedgerDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-ledger-db'
      Engine: postgres
      EngineVersion: '15.15'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !GetAtt CloudGuardKMSKey.Arn
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: cloudguard_ledger
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '02:00-03:00'
      PreferredMaintenanceWindow: 'Sun:04:00-Sun:05:00'
      MultiAZ: false
      PubliclyAccessible: false
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-RDS-PostgreSQL'
        - Key: ConsistencyModel
          Value: Relational-ACID-Strong

  # =========================================================================
  # UNIT 3 & 4: SERVERLESS COMPUTE (AWS LAMBDA FRAUD & ENCRYPTION WORKER)
  # =========================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-LambdaExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: CloudGuardLambdaLeastPrivilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SQSConsumption
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt TransactionQueue.Arn
              - Sid: KMSEncryptionAccess
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt CloudGuardKMSKey.Arn
              - Sid: DynamoDBAuditPersistence
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt CloudGuardAuditTable.Arn
              - Sid: SNSSecOpsNotification
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref FraudAlertSNSTopic
              - Sid: CloudWatchTelemetry
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'

  CloudGuardProcessingLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ProcessingLambda'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          KMS_KEY_ID: !Ref CloudGuardKMSKey
          DYNAMODB_TABLE: !Ref CloudGuardAuditTable
          RDS_HOST: !GetAtt CloudGuardLedgerDB.Endpoint.Address
          RDS_PORT: !GetAtt CloudGuardLedgerDB.Endpoint.Port
          RDS_DB: cloudguard_ledger
          RDS_USER: !Ref DBUsername
          RDS_PASS: !Ref DBPassword
          SNS_TOPIC_ARN: !Ref FraudAlertSNSTopic
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateAppSubnet1
          - !Ref PrivateAppSubnet2
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              import json
              print("CloudGuard Lambda Worker Ready. Batch size:", len(event.get('Records', [])))
              return {"statusCode": 200, "body": json.dumps({"status": "SUCCESS"})}
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ProcessingLambda'

  LambdaSQSEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      Enabled: true
      EventSourceArn: !GetAtt TransactionQueue.Arn
      FunctionName: !Ref CloudGuardProcessingLambda

  # =========================================================================
  # UNIT 3: HIGH AVAILABILITY & ELASTICITY (ALB + EC2 AUTO SCALING GROUP)
  # =========================================================================
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-EC2InstanceRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EC2IngestionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueUrl
                Resource: !GetAtt TransactionQueue.Arn
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2InstanceRole

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-ALB'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ALB'

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-TG'
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref CloudGuardVPC
      TargetType: instance
      HealthCheckIntervalSeconds: 15
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  EC2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-LT'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.micro
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref EC2AppSecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            dnf update -y
            dnf install -y nodejs git
            mkdir -p /opt/cloudguard-api
            cat <<'EOF' > /opt/cloudguard-api/server.js
            const http = require('http');
            const server = http.createServer((req, res) => {
              if (req.url === '/health') {
                res.writeHead(200, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({ status: 'HEALTHY', service: 'cloudguard-ec2-ingestion-node', uptime: process.uptime() }));
              } else {
                res.writeHead(200, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({ status: 'ACCEPTED', message: 'CloudGuard Ingestion Node Ready' }));
              }
            });
            server.listen(3000, () => console.log('CloudGuard API running on 3000'));
            EOF
            cat <<'EOF' > /etc/systemd/system/cloudguard.service
            [Unit]
            Description=CloudGuard Ingestion API
            After=network.target
            [Service]
            Type=simple
            User=ec2-user
            WorkingDirectory=/opt/cloudguard-api
            ExecStart=/usr/bin/node server.js
            Restart=always
            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable --now cloudguard.service
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-IngestionNode'

  EC2AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-ASG'
      VPCZoneIdentifier:
        - !Ref PrivateAppSubnet1
        - !Ref PrivateAppSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref EC2LaunchTemplate
        Version: !GetAtt EC2LaunchTemplate.LatestVersionNumber
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: '2'
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ASG-Node'
          PropagateAtLaunch: true

  # =========================================================================
  # UNIT 6: MONITORING & FINOPS (CLOUDWATCH ALARMS & AWS BUDGETS)
  # =========================================================================
  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-ASG-HighCPU'
      AlarmDescription: Trigger scale-out when EC2 ASG average CPU exceeds 80% for 2 periods
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref EC2AutoScalingGroup
      AlarmActions:
        - !Ref FraudAlertSNSTopic

  DLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-DLQ-DepthAnomaly'
      AlarmDescription: Trigger immediate SecOps alert if Transaction DLQ has > 0 poisoned messages
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TransactionDLQ.QueueName
      AlarmActions:
        - !Ref FraudAlertSNSTopic

  MonthlyStudentBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: CloudGuard-Monthly-Student-Safety-Cap
        BudgetLimit:
          Amount: 5.00
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertNotificationEmail

Outputs:
  VpcId:
    Description: CloudGuard Production VPC Identifier
    Value: !Ref CloudGuardVPC
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  ALBDnsName:
    Description: Public Entrypoint DNS for Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  SQSQueueUrl:
    Description: Transaction Ingestion SQS Queue URL
    Value: !Ref TransactionQueue
    Export:
      Name: !Sub '${AWS::StackName}-SQSQueueUrl'

  DLQQueueUrl:
    Description: Dead Letter Queue (DLQ) URL for Poison Pills
    Value: !Ref TransactionDLQ

  DynamoDBTableName:
    Description: DynamoDB Velocity and Compliance Audit Table
    Value: !Ref CloudGuardAuditTable

  RDSPostgresEndpoint:
    Description: Private Subnet RDS PostgreSQL Ledger Endpoint
    Value: !GetAtt CloudGuardLedgerDB.Endpoint.Address

  KMSKeyArn:
    Description: KMS Customer Managed Key ARN for Envelope Encryption
    Value: !GetAtt CloudGuardKMSKey.Arn

  SNSTopicArn:
    Description: Security and Fraud Alert SNS Bus ARN
    Value: !Ref FraudAlertSNSTopic
